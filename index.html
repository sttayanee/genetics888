function questionUI(i){let qs=questions(i);return `<p class="muted">${lang==='th'?'เลือกคำตอบให้ครบ แล้วกดตรวจ':'Answer every question, then check.'}</p>`+qs.map((x,j)=>`<div class="task"><b>${j+1}. ${esc(x.q)}</b><div class="choices">${x.opts.map((a,k)=>`<button class="choice" id="c${j}_${k}" onclick="choose(${j},${k})">${esc(a)}</button>`).join('')}</div></div>`).join('')+`<button class="primary" onclick="grade(${i})">${tr('check')}</button><div id="feedback"></div>`}
function choose(j,k){answers[j]=k;document.querySelectorAll(`[id^="c${j}_"]`).forEach((e,n)=>e.classList.toggle('selected',n===k))}
function grade(i){if(i===5&&challengeTimer){clearInterval(challengeTimer);challengeTimer=null}let qs=questions(i);if(i===5){for(let j=0;j<qs.length;j++)if(answers[j]===undefined)answers[j]=-1}if(Object.keys(answers).length<qs.length){$('feedback').innerHTML='<div class="feedback bad">'+(lang==='th'?'กรุณาตอบให้ครบทุกข้อ':'Please answer all questions')+'</div>';return}let n=qs.filter((x,j)=>answers[j]===x.correct).length,score=Math.round(n/qs.length*100);let details=qs.map((x,j)=>`<div class="task"><b>${j+1}. ${answers[j]===x.correct?'✓':'✕'} ${esc(x.q)}</b><p>${tr('answer')}: ${esc(x.opts[x.correct])}</p><p class="muted">${esc(x.why)}</p></div>`).join('');finish(i,score,details)}

const pairData=[
[['ยีน','Gene'],['แอลลีล','Allele'],['โครโมโซม','Chromosome'],['จีโนไทป์','Genotype'],['ฟีโนไทป์','Phenotype']],
[['ส่วนของ DNA ที่มีข้อมูลพันธุกรรม','DNA segment with hereditary information'],['รูปแบบหนึ่งของยีน','Variant of a gene'],['โครงสร้างที่มี DNA และโปรตีน','DNA-protein structure'],['รูปแบบแอลลีลของสิ่งมีชีวิต','Allele combination'],['ลักษณะที่แสดงออก','Observable trait']]
];
function matchUI(){let left=pairData[0].map((a,i)=>({id:i,side:0,label:a[lang==='th'?0:1]})),right=pairData[1].map((a,i)=>({id:i,side:1,label:a[lang==='th'?0:1]}));right.sort(()=>Math.random()-.5);matchPairs=[];matchFirst=null;matchDone=0;
$('activityBody').innerHTML=`<p class="muted">${lang==='th'?'เกมจับคู่: คลิกคำศัพท์ทางซ้าย แล้วคลิกความหมายทางขวา':'Matching game: click a term on the left and its definition on the right.'}</p><div class="row" style="align-items:stretch"><div class="task" style="flex:1">${left.map(x=>`<button class="choice" style="display:block;width:100%;margin:7px 0" id="pair0_${x.id}" onclick="pickPair(0,${x.id})">${x.label}</button>`).join('')}</div><div class="task" style="flex:1">${right.map(x=>`<button class="choice" style="display:block;width:100%;margin:7px 0" id="pair1_${x.id}" onclick="pickPair(1,${x.id})">${x.label}</button>`).join('')}</div></div><div id="feedback"></div>`}
function pickPair(side,id){let b=$('pair'+side+'_'+id);if(b.disabled)return;if(!matchFirst){matchFirst={side,id};b.classList.add('selected');return}if(matchFirst.side===side){$('pair'+matchFirst.side+'_'+matchFirst.id).classList.remove('selected');matchFirst={side,id};b.classList.add('selected');return}
let ok=matchFirst.id===id;let prev=$('pair'+matchFirst.side+'_'+matchFirst.id);prev.classList.remove('selected');matchFirst=null;if(ok){prev.disabled=b.disabled=true;prev.style.background=b.style.background='#216b60';matchDone++;$('feedback').innerHTML=`<div class="feedback">${tr('correct')} ${matchDone}/5</div>`;if(matchDone===5)finish(0,100,`<p>${lang==='th'?'จับคู่ครบทั้งห้าคู่':'All five pairs matched.'}</p>`)}else{$('feedback').innerHTML=`<div class="feedback bad">${tr('incorrect')} ${lang==='th'?'ลองจับคู่ใหม่':'Try another pair'}</div>`}}
function sortUI(){sortDone=0;sortCorrect=0;renderSort()}
const sortCases=[['AA',0],['Aa',0],['aa',1],['Aa',0],['aa',1],['AA',0],['aa',1],['Aa',0],['AA',0],['aa',1]];
function renderSort(){let x=sortCases[sortDone];if(!x){finish(1,sortCorrect*10,`<p>${lang==='th'?'จำไว้ว่า AA และ Aa แสดงลักษณะเด่นเมื่อ A เด่นสมบูรณ์ ส่วน aa แสดงลักษณะด้อย':'With complete dominance, AA and Aa are dominant; aa is recessive.'}</p>`);return}
$('activityBody').innerHTML=`<div class="task" style="text-align:center"><p>${lang==='th'?'เกมคัดแยกลักษณะ: A เด่นสมบูรณ์เหนือ a':'Trait sorting: A is completely dominant over a'}</p><div style="font-size:65px;font-weight:900;color:var(--yellow)">${x[0]}</div><p>${sortDone+1}/10 • ${tr('score')}: ${sortCorrect*10}</p><div class="choices" style="justify-content:center"><button class="primary" onclick="sortPick(0)">${tr('dominant')}</button><button class="primary" onclick="sortPick(1)">${tr('recessive')}</button></div></div>`}
function sortPick(a){if(a===sortCases[sortDone][1])sortCorrect++;sortDone++;renderSort()}
let fillCross=[],fillIndex=0,fillCorrect=0;
function fillUI(){fillCross=[['Aa','Aa'],['AA','aa'],['Aa','aa'],['aa','aa'],['AA','Aa']];fillIndex=0;fillCorrect=0;renderFill()}
function renderFill(){if(fillIndex>=fillCross.length){finish(2,fillCorrect*20,`<p>${lang==='th'?'เติมตารางได้ถูกต้อง '+fillCorrect+' จาก 5 รอบ':'Correct Punnett squares: '+fillCorrect+' of 5'}</p>`);return}
let [d,m]=fillCross[fillIndex],dg=gametes(d),mg=gametes(m);
$('activityBody').innerHTML=`<p class="muted">${lang==='th'?'เกมเติมช่องว่าง: เลือกจีโนไทป์ให้ครบทั้ง 4 ช่อง':'Fill-in puzzle: choose the genotype in each of the four cells.'}</p><h3>${d} × ${m} • ${fillIndex+1}/5</h3><div class="punnett"><div>×</div><div class="head">${mg[0]}</div><div class="head">${mg[1]}</div>${dg.map((a,j)=>`<div class="head">${a}</div>${mg.map((b,k)=>`<select id="cell${j}${k}"><option value="">?</option><option>AA</option><option>Aa</option><option>aa</option></select>`).join('')}`).join('')}</div><button class="primary" onclick="checkFill()">${tr('check')}</button><div id="feedback"></div>`}
function checkFill(){let [d,m]=fillCross[fillIndex],dg=gametes(d),mg=gametes(m),correct=true;for(let j=0;j<2;j++)for(let k=0;k<2;k++){let want=[dg[j],mg[k]].sort().join('');if($('cell'+j+k).value!==want)correct=false}
if(correct)fillCorrect++;fillIndex++;renderFill()}
let evidence=0;
function detectiveUI(){evidence=0;renderDetective()}
function renderDetective(){let clues=lang==='th'?['พ่อและแม่ไม่แสดงลักษณะผิดปกติ','ลูกชายแสดงลักษณะด้อย aa','ทั้งพ่อและแม่ต้องส่งแอลลีล a ให้ลูก']:['Both parents are unaffected','Their son has recessive genotype aa','Both parents must pass allele a'];
$('activityBody').innerHTML=`<p class="muted">${lang==='th'?'เกมสืบสวน: เปิดหลักฐานทีละชิ้นแล้วสรุปจีโนไทป์ของพ่อแม่':'Detective game: reveal clues and infer the parents’ genotypes.'}</p><div class="task" style="text-align:center;font-size:34px">□ ? ─── ○ ?<br>│<br>■ aa</div><div class="choices">${clues.map((x,i)=>`<button class="choice" ${i>evidence?'disabled':''} onclick="reveal(${i})">${i<evidence?'✓ '+x:'🔎 '+(lang==='th'?'หลักฐาน ':'Clue ')+(i+1)}</button>`).join('')}</div><div id="detectAnswer"></div><div id="feedback"></div>`;if(evidence>=3)$('detectAnswer').innerHTML=`<div class="task"><b>${lang==='th'?'พ่อและแม่มีจีโนไทป์ใด?':'What are the parents’ genotypes?'}</b><div class="choices">${['AA × AA','Aa × Aa','aa × aa'].map((x,i)=>`<button class="choice" onclick="solveDetective(${i})">${x}</button>`).join('')}</div></div>`}
function reveal(i){if(i===evidence){evidence++;renderDetective()}}
function solveDetective(i){finish(4,i===1?100:0,`<p>${lang==='th'?'เฉลย: Aa × Aa พ่อแม่ไม่แสดงลักษณะด้อย แต่ทั้งคู่เป็นพาหะและสามารถมีลูก aa ได้':'Answer: Aa × Aa. Both unaffected carrier parents can have an aa child.'}</p>`)}
function challengeUI(){if(challengeTimer)clearInterval(challengeTimer);challengeSeconds=90;answers={};$('activityBody').innerHTML=`<div class="task"><b>⏱ <span id="clock">90</span>s</b> • ${lang==='th'?'ตอบคำถาม 10 ข้อก่อนหมดเวลา':'Answer 10 questions before time runs out'}</div>`+questionUI(5);challengeTimer=setInterval(()=>{challengeSeconds--;$('clock').textContent=challengeSeconds;if(challengeSeconds<=0){clearInterval(challengeTimer);challengeTimer=null;grade(5)}},1000)}
function openMission(i){if(i>=progress.unlocked)return;current=i;answers={};render();$('activityTitle').textContent='MISSION '+String(i+1).padStart(2,'0')+' • '+tr('names')[i];if(challengeTimer){clearInterval(challengeTimer);challengeTimer=null}if(i===0)matchUI();else if(i===1)sortUI();else if(i===2)fillUI();else if(i===3)labUI();else if(i===4)detectiveUI();else challengeUI();$('activity').scrollIntoView({behavior:'smooth',block:'start'})}
function pedigreeUI(){$('activityBody').innerHTML=`<div class="task"><h3>${lang==='th'?'กรณีศึกษา: ลักษณะด้อยบนออโตโซม':'Case study: autosomal recessive trait'}</h3><div style="text-align:center;font-size:34px">□ Aa ─── ○ Aa<br>│<br>■ aa &nbsp; ○ AA/Aa</div><p class="muted">${lang==='th'?'■ = ลูกชายแสดงลักษณะด้อย; พ่อและแม่ไม่แสดงลักษณะด้อย':'■ = affected son; both parents are unaffected'}</p></div>`+questionUI(4)}
function punnettUI(){$('activityBody').innerHTML=`<div class="row"><label>${tr('father')} <select id="dad" onchange="updateSquare()"><option>AA</option><option selected>Aa</option><option>aa</option></select></label><label>${tr('mother')} <select id="mom" onchange="updateSquare()"><option>AA</option><option selected>Aa</option><option>aa</option></select></label></div><div class="punnett" id="square"></div><p id="squareStats"></p>`+questionUI(2);updateSquare()}
function gametes(g){return g==='AA'?['A','A']:g==='aa'?['a','a']:['A','a']}
function updateSquare(){let d=gametes($('dad').value),m=gametes($('mom').value),cells=[];for(let a of d)for(let b of m)cells.push([a,b].sort().join(''));$('square').innerHTML=`<div>×</div><div class="head">${m[0]}</div><div class="head">${m[1]}</div>`+d.map((a,j)=>`<div class="head">${a}</div><div>${[a,m[0]].sort().join('')}</div><div>${[a,m[1]].sort().join('')}</div>`).join('');$('squareStats').textContent=['AA','Aa','aa'].map(g=>g+': '+cells.filter(c=>c===g).length*25+'%').join(' • ')}
let simulation=[];
function labUI(){$('activityBody').innerHTML=`<p class="muted">${tr('hint')}</p><div class="row"><div class="task"><label>${tr('father')}: P(A) <b id="p1v">50%</b></label><input class="slider" type="range" id="p1" min="0" max="100" value="50" oninput="updateLab()"></div><div class="task"><label>${tr('mother')}: P(A) <b id="p2v">50%</b></label><input class="slider" type="range" id="p2" min="0" max="100" value="50" oninput="updateLab()"></div></div><div class="task"><h3>${tr('theory')}</h3><div id="bars"></div></div><div class="task"><h3>${tr('observed')}</h3><div class="row"><button class="secondary" onclick="simulate(10)">10</button><button class="secondary" onclick="simulate(100)">100</button><button class="secondary" onclick="simulate(1000)">1000</button></div><div id="simBars" class="muted">${lang==='th'?'กดจำนวนครั้งเพื่อทดลอง':'Select a trial count'}</div></div><div class="task"><b>${lang==='th'?'คำถาม: ถ้าพ่อและแม่เป็น Aa ตามเมนเดล ต้องตั้ง Slider อย่างไร?':'Question: For two Mendelian Aa parents, how should the sliders be set?'}</b><div class="choices"><button class="choice" onclick="answers[0]=0;markLab(this)">50% / 50%</button><button class="choice" onclick="answers[0]=1;markLab(this)">100% / 0%</button><button class="choice" onclick="answers[0]=2;markLab(this)">75% / 75%</button></div><button class="primary" onclick="gradeLab()">${tr('check')}</button><div id="feedback"></div></div>`;simulation=[];updateLab()}
function markLab(el){el.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function vals(){let p=+$('p1').value/100,q=+$('p2').value/100;return [p*q,p*(1-q)+(1-p)*q,(1-p)*(1-q)]}
function makeBars(v){return ['AA','Aa','aa'].map((g,i)=>`<div class="small">${g}: ${(v[i]*100).toFixed(1)}%</div><div class="bar"><div style="width:${v[i]*100}%"></div></div>`).join('')}
function updateLab(){$('p1v').textContent=$('p1').value+'%';$('p2v').textContent=$('p2').value+'%';$('bars').innerHTML=makeBars(vals());simulation=[];$('simBars').innerHTML=lang==='th'?'ปรับตัวแปรแล้ว กรุณาทดลองใหม่':'Parameters changed; run again.'}
function simulate(n){let p=+$('p1').value/100,q=+$('p2').value/100,counts=[0,0,0];for(let k=0;k<n;k++){let a=Math.random()<p,b=Math.random()<q;counts[a&&b?0:a||b?1:2]++}simulation=counts;$('simBars').innerHTML=`<p>n = ${n}</p>`+makeBars(counts.map(x=>x/n))}
function gradeLab(){if(answers[0]===undefined){$('feedback').textContent=tr('select');return}finish(3,answers[0]===0?100:0,`<div class="task">${tr('answer')}: 50% / 50%. ${tr('hint')}</div>`)}
render();
</script></body></html>
